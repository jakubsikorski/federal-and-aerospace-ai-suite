# TLS-terminating reverse proxy (design section 15.5, D15).
#
# This is the only container that holds a certificate and the only one that
# publishes a port to the LAN. It exists because MediaMTX serves WHIP publish
# and WHEP read on ONE listener (:8889): enabling webrtcEncryption there would
# force DLSPS's whipclientsink to trust a self-signed cert, which would require
# installing a CA into a pinned image. Prohibited.
#
# The asymmetry is the requirement:
#   browser -> HTTPS here -> plain HTTP to MediaMTX, WHEP only
#   DLSPS   -> plain HTTP straight to MediaMTX, WHIP, never through this proxy

worker_processes 1;
events { worker_connections 512; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;
  access_log    /dev/stdout;
  error_log     /dev/stderr warn;

  upstream backend  { server backend:8100; }
  upstream mediamtx { server mediamtx:8889; }

  server {
    listen 8443 ssl;
    http2  on;
    server_name _;

    ssl_certificate     /etc/tls/server.crt;
    ssl_certificate_key /etc/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # getUserMedia needs a secure context; nothing here may be served over HTTP.
    client_max_body_size 32m;

    # --- WHEP read leg: the ONLY MediaMTX route exposed --------------------
    # Matches /<annotated path>/whep and its session subpath. The session
    # subpath must be proxied too: MediaMTX answers POST with a root-relative
    # Location like /annotated1/whep/<uuid>, and the browser sends its trickle
    # ICE PATCH and teardown DELETE back there. Mounting the identical prefix
    # is what makes rewriting unnecessary.
    location ~ "^/(annotated[0-9]+)/whep(/[A-Za-z0-9-]+)?$" {
      proxy_pass http://mediamtx;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      # SDP exchange: pass it straight through, never buffer or rewrite.
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 30s;
    }

    # --- WHIP publish leg: explicitly refused ------------------------------
    # WHIP is a publish verb. Exposing it to the browser origin would let any
    # client overwrite or tear down the annotated feed. DLSPS reaches MediaMTX
    # directly on the internal network and does not need this route.
    location ~ "^/[^/]+/whip" { return 403; }

    # MediaMTX RTSP, HLS and its :9997 control API are simply not routed:
    # there is no wildcard location to the mediamtx upstream.

    # --- application ------------------------------------------------------
    location / {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
      # SSE and WebSocket for live updates (Phase 4).
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout 3600s;
    }
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }
}
