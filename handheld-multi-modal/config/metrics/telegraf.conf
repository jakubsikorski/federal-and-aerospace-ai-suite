# =============================================================================
# Telegraf Configuration for Metrics Manager
# =============================================================================
#
# This configuration collects system metrics and exposes them via:
# 1. Prometheus endpoint (scraped by the Metrics Manager for SSE streaming)
#
# To use a custom configuration, mount your own config file to:
#   /etc/telegraf/telegraf.conf
#
# Or mount additional configs to /etc/telegraf/telegraf.d/
#
# =============================================================================

# -----------------------------------------------------------------------------
# Global Agent Configuration
# -----------------------------------------------------------------------------
[agent]
  ## Default data collection interval for all inputs
  interval = "1s"

  ## Compose supplies an explicit METRICS_MANAGER_HOSTNAME so Telegraf and the
  ## native GPU/NPU plugins use the same stable `host` label across reboots.
  hostname = "${METRICS_MANAGER_HOSTNAME}"

  ## Rounds collection interval to 'interval'
  round_interval = true

  ## Telegraf will send metrics to outputs in batches
  metric_batch_size = 2000

  ## Maximum number of unwritten metrics per output
  metric_buffer_limit = 20000

  ## Collection jitter
  collection_jitter = "0s"

  ## Default flushing interval for all outputs
  flush_interval = "1s"

  ## Jitter the flush interval
  flush_jitter = "0s"

  ## Precision for timestamps
  precision = "1s"

  ## Log at debug level
  debug = false

  ## Log only error level messages
  quiet = true

# -----------------------------------------------------------------------------
# Input Plugins - System Metrics
# -----------------------------------------------------------------------------

# CPU usage metrics
[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = false
  core_tags = false
  fieldinclude = ["usage_user", "usage_system", "usage_idle"]

# Memory usage metrics
[[inputs.mem]]
  fieldinclude = ["used_percent", "available_percent", "total", "used"]

# CPU frequency, split by core class (P / E / low-power E)
# The plugin keeps emitting the cpu_frequency_avg measurement that the previous
# shell script produced, and adds a per-class breakdown alongside it.
[[inputs.execd]]
  command = ["/usr/libexec/metrics-manager/mm-plugin-cpu"]
  data_format = "influx"

# GPU metrics via qmassa (Intel GPUs)
[[inputs.execd]]
  command = ["/usr/libexec/metrics-manager/mm-plugin-gpu", "-clients", "-clients-limit", "10"]
  data_format = "influx"

# NPU metrics via PMT telemetry sysfs (Intel NPU / VPU)
[[inputs.execd]]
  command = ["/usr/libexec/metrics-manager/mm-plugin-npu"]
  data_format = "influx"

# Busiest processes by CPU and by resident memory.
#
# The limit applies to each ranking and the two are combined, so 10 publishes
# up to twenty rows. Each row is a time series tagged with a process id, so
# raising it raises how fast a Prometheus scrape accumulates series.
[[inputs.execd]]
  command = ["/usr/libexec/metrics-manager/mm-plugin-proc", "-limit", "10"]
  data_format = "influx"

# System memory bandwidth from the integrated memory controller.
#
# This is whole-package DRAM throughput, not per-device GPU bandwidth: neither
# i915 nor xe publishes a byte counter per device, so per-device bandwidth
# cannot be measured on an Intel GPU. On a machine whose GPU has no dedicated
# memory it is still the closest signal, because the GPU competes for exactly
# this bandwidth.
#
# Reading it goes through perf and needs CAP_PERFMON, supplied by the existing
# privileged metrics container.
[[inputs.execd]]
  command = ["/usr/libexec/metrics-manager/mm-plugin-membw"]
  data_format = "influx"

# Platform power, thermal design power and idle-state residency.
#
# Reads model-specific registers and RAPL counters, both of which need
# privileges. In the container every process already runs as root, so this sits
# in the main agent; the bare-metal package runs it as a separate service
# because there Telegraf is unprivileged.
#
# Requires the msr kernel module on the host. Without it the package power and
# C-state fields are simply absent.
[[inputs.intel_powerstat]]
  ## "current_dram_power_consumption" is omitted on purpose: where the DRAM
  ## RAPL domain is missing, which is common on mobile parts, requesting it
  ## logs an error on every interval instead of being skipped the way an
  ## unsupported C-state is.
  package_metrics = [
    "current_power_consumption",
    "thermal_design_power",
    "cpu_base_frequency",
    "max_turbo_frequency",
    "uncore_frequency",
  ]
  ## Four idle states on every logical CPU. Unsupported ones are detected and
  ## skipped with a single warning.
  cpu_metrics = [
    "cpu_c0_state_residency",
    "cpu_c1_state_residency",
    "cpu_c6_state_residency",
    "cpu_c7_state_residency",
  ]
  msr_read_timeout = "100ms"

# Temperature sensors
[[inputs.temp]]
  ## Collects all temperature sensors

# Filter temperature to only include CPU package temperature
[[processors.starlark]]
  namepass = ["temp"]
  source = '''
def apply(metric):
    return metric if metric.tags.get("sensor", "").startswith("coretemp_package_id_") else None
'''

# User-provided custom metrics via executable scripts
# Place shell scripts (.sh) or Python scripts (.py) in /app/custom-metrics/
# Scripts should output InfluxDB Line Protocol format on stdout
# Example: my_sensor.py → outputs: "my_metric value=42"
[[inputs.exec]]
  commands = ["/bin/sh -c 'for f in /app/custom-metrics/*.sh /app/custom-metrics/*.py; do [ -f \"$f\" ] && [ -x \"$f\" ] && \"$f\"; done 2>/dev/null; true'"]
  timeout = "5s"
  data_format = "influx"
  interval = "10s"

# -----------------------------------------------------------------------------
# Output Plugins
# -----------------------------------------------------------------------------

# Prometheus metrics endpoint (for scraping)
[[outputs.prometheus_client]]
  listen = ":${TELEGRAF_PORT}"
  metric_version = 1
  path = "/metrics"
  collectors_exclude = ["gocollector", "process"]
  string_as_label = true
  export_timestamp = true

# -----------------------------------------------------------------------------
# Additional Input Examples (commented out)
# -----------------------------------------------------------------------------

# Uncomment to enable disk metrics
# [[inputs.disk]]
#   ignore_fs = ["tmpfs", "devtmpfs", "devfs", "overlay", "aufs", "squashfs"]

# Uncomment to enable network metrics
# [[inputs.net]]
#   interfaces = ["eth*", "en*"]
#   ignore_protocol_stats = true

# Docker per-container CPU and memory (application local edit).
# Requires the host Docker socket mounted read-only at /var/run/docker.sock
# (see compose/handheld-multi-modal.yaml). Scoped to this application's
# running containers; container labels are dropped so series keep stable keys.
# Exported as docker_container_cpu_usage_percent{cpu="cpu-total"} (100 = one
# core, so it can exceed 100), docker_container_mem_usage and
# docker_container_mem_limit (bytes), docker_container_mem_usage_percent, and
# the engine's host CPU count docker_n_cpus (Backend divides by it to show a
# share of the whole machine).
[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  interval = "2s"
  gather_services = false
  container_name_include = ["handheld-*"]
  container_name_exclude = []
  container_state_include = ["running"]
  docker_label_exclude = ["*"]
  timeout = "5s"
  perdevice_include = []
  total_include = ["cpu"]
  namepass = ["docker", "docker_container_cpu", "docker_container_mem"]
  fieldinclude = ["usage_percent", "usage", "limit", "n_cpus"]
  taginclude = ["host", "container_name", "cpu"]

# -----------------------------------------------------------------------------
# Per-service KPI scrape (Chat Q&A, Audio Analyzer, Text To Speech)
#
# DISABLED ON PURPOSE. Keep this block commented out until the pinned service
# images serve /metrics with the series named below. The pinned release,
# 2026.3.0-rc2 (intel/chatqna:core_2026.3.0-rc2, intel/audio-analyzer:
# 2026.3.0-rc2, intel/text-to-speech:2026.3.0-rc2), does not serve them yet, so
# enabling the block now would only produce scrape errors. Do not modify the
# images; enable this only after a release that ships the metrics is pinned in
# compose/handheld-multi-modal.yaml.
#
# Histogram safety: this scrape route keeps _bucket (le), _sum and _count all
# the way to :9273, /api/v1/metrics/latest and /metrics/stream. The OTLP push
# route (/api/v1/metrics/otlp) DROPS the buckets, so use this scrape route (or
# explicit _bucket series pushed as JSON) whenever p50/p95 are wanted.
#
# metric_version MUST be 1 (the default). With metric_version = 2 a scraped
# histogram makes the Prometheus export emit a duplicate "le" label, which turns
# /api/v1/metrics/latest into HTTP 500 and breaks ALL telemetry, not just these
# series.
#
# Targets are the compose service names and container ports on the "handheld"
# network (same network as metrics-manager). namepass uses globs so the
# _bucket/_sum/_count series of each histogram are kept.
#
# [[inputs.prometheus]]
#   urls = [
#     "http://chatqna:8888/metrics",
#     "http://audio-analyzer:8010/metrics",
#     "http://tts:8011/metrics",
#   ]
#   metric_version = 1
#   response_timeout = "3s"
#   namepass = [
#     # Chat Q&A
#     "chatqna_queue_wait_seconds*",
#     "chatqna_ttft_seconds*",
#     "chatqna_decode_tokens_per_second*",
#     "chatqna_request_seconds*",
#     "chatqna_requests_total*",
#     "chatqna_requests_in_flight*",
#     # Audio Analyzer
#     "audio_analyzer_inference_seconds*",
#     "audio_analyzer_queue_wait_seconds*",
#     "audio_analyzer_audio_duration_seconds*",
#     "audio_analyzer_rtf*",
#     "audio_analyzer_requests_total*",
#     "audio_analyzer_requests_in_flight*",
#     # Text To Speech
#     "tts_generate_seconds*",
#     "tts_audio_duration_seconds*",
#     "tts_rtf*",
#     "tts_queue_wait_seconds*",
#     "tts_requests_total*",
#     "tts_requests_in_flight*",
#   ]

# -----------------------------------------------------------------------------
# HTTP Listener for pushing metrics (InfluxDB Line Protocol)
#
# Used by the Metrics Manager FastAPI app (app/store.py) to persist custom
# metrics ingested via /api/v1/metrics* so they show up on the Prometheus
# endpoint (and therefore the SSE stream). Can also be used directly by any
# client that already speaks InfluxDB Line Protocol.
# -----------------------------------------------------------------------------

# Accept InfluxDB Line Protocol via HTTP
[[inputs.http_listener_v2]]
  service_address = ":${TELEGRAF_HTTP_PORT}"
  paths = ["/write"]
  methods = ["POST"]
  data_format = "influx"
  read_timeout = "10s"
  write_timeout = "10s"
