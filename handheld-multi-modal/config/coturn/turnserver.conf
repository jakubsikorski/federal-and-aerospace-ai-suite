# Stock coturn/coturn:4.18.0 TURN server, localhost-only profile
# (AGENTS.md Architectural boundaries).
# Assists MediaMTX WebRTC ICE only ("Coturn <-> MediaMTX WebRTC only"); no
# DLSPS->Coturn path. Host networking lets the relay reach MediaMTX's
# loopback-published ICE port 127.0.0.1:8189/udp; everything else is denied.
#
# Purpose: a browser that reaches this device only through an SSH tunnel
# (ssh -L 8443:127.0.0.1:8443 -L 3478:127.0.0.1:3478) uses TURN over TCP;
# SSH carries TCP only, so the direct UDP path is unavailable there.

# Listener and relay sockets: loopback only. No external-ip is advertised.
listening-ip=127.0.0.1
relay-ip=127.0.0.1
listening-port=3478
min-port=49160
max-port=49200

# Peers: only 127.0.0.1 (MediaMTX ICE at 8189/udp is the only 127.0.0.1 UDP
# listener). Coturn cannot restrict peer ports; RFC1918, link-local, other
# loopback addresses and IPv6 stay denied.
allow-loopback-peers
denied-peer-ip=0.0.0.0-255.255.255.255
denied-peer-ip=::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
allowed-peer-ip=127.0.0.1
no-multicast-peers
# UDP relay only: no TCP allocations (RFC 6062) to local TCP services.
no-tcp-relay

# Bound allocations: a few cameras per browser, few browsers.
user-quota=16
total-quota=32

fingerprint
lt-cred-mech
realm=handheld.local
# Dev-only static long-term credential; reachable from the local host only.
# Also in config/mediamtx/mediamtx.yml webrtcICEServers2.
user=handheld:handheldmultimodal
no-tls
no-dtls
log-file=stdout
