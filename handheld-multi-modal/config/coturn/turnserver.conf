# Stock coturn/coturn:4.18.0 TURN/STUN server config.
# Assists MediaMTX WebRTC ICE only (per handheld-architecture boundary:
# "Coturn <-> MediaMTX WebRTC only"). No DLSPS->Coturn path exists or is
# configured.
#
# listening-ip / external-ip are host-specific; the actual value is
# supplied at container start via --external-ip on the command line
# (compose/bootstrap-compose.yaml, COTURN_EXTERNAL_IP env var, defaulting
# to this Lunar Lake host's current LAN IP 10.123.233.207) so this file
# stays portable across hosts. Confirm/override on a different target
# device.
listening-port=3478
min-port=49160
max-port=49200
fingerprint
lt-cred-mech
realm=handheld.local
# Bootstrap/dev-only static long-term credential, not a production secret.
# A real deployment should use --use-auth-secret/--static-auth-secret
# (time-limited credentials) instead of this fixed user/pass.
user=handheld:handheldbootstrap
no-cli
no-multicast-peers
no-tls
no-dtls
log-file=stdout
