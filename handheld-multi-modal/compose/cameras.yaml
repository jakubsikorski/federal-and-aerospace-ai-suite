# Demo camera publishers - REMOVABLE DEMO ASSETS (design section 22).
#
# Real deployments (`make up`) publish their own feeds to
# rtsp://127.0.0.1:8554/camN on the device (RTSP is loopback-only); nothing in
# the application depends on this file. It exists so the demo has N
# reproducible feeds instead of a hand-started ffmpeg that dies with the shell.
#
#   make demo-up CAMERAS=2     start the application with cam1 and cam2
#   make clean-demo            remove these publishers and their videos
#
# -c copy: every .ts is already H.264, so this remuxes rather than re-encodes. Publishing costs ~1% CPU per camera and leaves the measured
# per-camera pipeline cost (design 3.4) attributable to DLSPS, not to the
# simulator. -re paces at real time; -stream_loop -1 loops forever.
#
# Sources (pinned in scripts/demo_assets.py, re-encoded to .ts by make demo-prereq):
#   cam1  person-bicycle-car-detection.max30.ts  intel-iot-devkit sample, 768x432 12 fps
#   cam2  pexels-34622113.max30.ts  Pexels 34622113, 59.94 fps source capped to 30 fps
#
# Add more cameras in the console's Cameras panel (or `make up` with your own).

name: handheld-multi-modal

x-camera: &camera
  image: jrottenberg/ffmpeg:6.1-ubuntu2404
  restart: unless-stopped
  network_mode: "container:handheld-multi-modal-mediamtx-1"
  volumes:
    - ../data/dlsps/demo-video:/video:ro
  entrypoint: ["ffmpeg"]

services:
  cam1:
    <<: *camera
    container_name: handheld-demo-cam1
    command: ["-nostdin", "-hide_banner", "-loglevel", "warning",
              "-re", "-stream_loop", "-1", "-i", "/video/person-bicycle-car-detection.max30.ts",
              "-map", "0:v:0", "-c", "copy",
              "-f", "rtsp", "-rtsp_transport", "tcp", "rtsp://127.0.0.1:8554/cam1"]
  cam2:
    <<: *camera
    container_name: handheld-demo-cam2
    command: ["-nostdin", "-hide_banner", "-loglevel", "warning",
              "-re", "-stream_loop", "-1", "-i", "/video/pexels-34622113.max30.ts",
              "-map", "0:v:0", "-c", "copy",
              "-f", "rtsp", "-rtsp_transport", "tcp", "rtsp://127.0.0.1:8554/cam2"]
