<svg viewBox="0 0 1240 784" width="1240" height="784" xmlns="http://www.w3.org/2000/svg" role="img"><style>svg { font-family: system-ui, 'Segoe UI', Roboto, sans-serif; }
svg {  --bg: #0e1a2c; --panel: #16273c; --panel2: #1c3149; --line: #35506f; --text: #edf4ff; --muted: #a9bcd3; --accent: #72e4df; --video: #5fd4e8; --webrtc: #8be0b5; --mqtt: #c3a6ff; --rest: #7fb2ff; --files: #f4c779; --turn: #9fb0c4; --npu: #b99bff; --gpu: #6fd0a0; --cpu: #7fb2ff; --oep: #3fa0ff; --oep-fill: #0a63b8; --oss: #8a9db6; --app: #5aa7b0; }
.lane rect { fill: rgba(255, 255, 255, 0.02); stroke: rgba(255, 255, 255, 0.07); }
#lanes .bus { fill: var(--rest); font-size: 13px; font-weight: 700; letter-spacing: 2px; }
.lane text { fill: rgb(142, 164, 191); font-size: 13.5px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; }
.node { cursor: pointer; outline: none; }
.node &gt; rect.box { fill: var(--panel2); stroke: rgb(74, 102, 136); stroke-width: 1.5px; transition: stroke 0.2s, fill 0.2s; }
.node.app &gt; rect.box { fill: rgb(26, 58, 76); stroke: var(--app); }
.node.oep &gt; rect.box { fill: rgb(16, 51, 90); stroke: var(--oep); stroke-width: 2.5px; }
.node .bar { fill: var(--oep-fill); }
.node.oep .t { fill: rgb(255, 255, 255); }
.node.oep .ic { stroke: rgb(255, 255, 255); }
.node.oep .tag { fill: rgb(207, 230, 255); }
.tab rect { stroke-width: 1.2px; }
.tab text { font-size: 10.5px; font-weight: 800; letter-spacing: 1px; }
.tab.oep rect { fill: rgb(255, 255, 255); stroke: var(--oep); }
.tab.oep text { fill: var(--oep-fill); }
.tab.oss rect { fill: rgb(38, 54, 75); stroke: var(--oss); }
.tab.oss text { fill: rgb(210, 222, 236); }
.tab.app rect { fill: rgb(28, 77, 92); stroke: var(--app); }
.tab.app text { fill: rgb(220, 255, 252); }
.node .tag { fill: var(--muted); font-size: 14px; }
.node .ep { font: 12.5px ui-monospace, "SFMono-Regular", Menlo, monospace; fill: rgb(214, 230, 255); }
.node .ep .m { fill: var(--rest); font-weight: 700; }
.node.setup &gt; rect.box { fill: rgb(21, 37, 58); stroke-dasharray: 6px, 5px; }
.node .t { fill: var(--text); font-size: 18.5px; font-weight: 700; }
.node .s { fill: var(--muted); font-size: 15px; }
.node .ic { fill: none; stroke: var(--accent); stroke-width: 1.8px; stroke-linecap: round; stroke-linejoin: round; }
.chip rect { }
.chip text { font-size: 13px; font-weight: 700; }
.chip.npu rect { fill: rgba(185, 155, 255, 0.15); stroke: var(--npu); }
.chip.npu text { fill: var(--npu); }
.chip.gpu rect { fill: rgba(111, 208, 160, 0.15); stroke: var(--gpu); }
.chip.gpu text { fill: var(--gpu); }
.chip.cpu rect { fill: rgba(127, 178, 255, 0.15); stroke: var(--cpu); }
.chip.cpu text { fill: var(--cpu); }
.edge path { fill: none; stroke-width: 2.6px; stroke-linecap: round; stroke-linejoin: round; opacity: 0.85; transition: opacity 0.2s, stroke-width 0.2s; }
.edge text { font-size: 14px; font-weight: 600; paint-order: stroke; stroke: rgb(15, 29, 49); stroke-width: 5px; stroke-linejoin: round; }
.video path { stroke: var(--video); }
.video text { fill: var(--video); }
.webrtc path { stroke: var(--webrtc); }
.webrtc text { fill: var(--webrtc); }
.mqtt path { stroke: var(--mqtt); }
.mqtt text { fill: var(--mqtt); }
.rest path { stroke: var(--rest); }
.rest text { fill: var(--rest); }
.files path { stroke: var(--files); }
.files text { fill: var(--files); }
.turn path { stroke: var(--turn); stroke-dasharray: 5px, 6px; }
.turn text { fill: var(--turn); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 8px 12px 6px; font-size: 13px; color: var(--muted); }
table { border-collapse: collapse; width: 100%; }
.legend-text { fill: #a9bcd3; font-size: 14px; } .legend-text tspan { font-weight: 700; }
.edge-key { fill: none; stroke-width: 3; } .edge-key.video { stroke: var(--video); } .edge-key.webrtc { stroke: var(--webrtc); }
.edge-key.turn { stroke: var(--turn); stroke-dasharray: 5 6; } .edge-key.mqtt { stroke: var(--mqtt); } .edge-key.files { stroke: var(--files); }
.edge-key.rest { stroke: var(--rest); } .box-key { stroke-width: 2; } .box-key.oep { fill: var(--oep-fill); stroke: var(--oep); }
.box-key.oss { fill: var(--panel2); stroke: #4a6688; } .box-key.app { fill: #1a3a4c; stroke: var(--app); }</style><title>Handheld multi-modal application architecture: Intel Open Edge Platform microservices, open-source infrastructure and the application Backend</title>
      
