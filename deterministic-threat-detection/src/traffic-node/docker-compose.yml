# Machine-4 (the traffic injector): its CPU/memory/GPU load for the dashboard, and the load agent that
# runs the iperf3 client on request. Started from machine-1 by deploy.sh (docker -H ssh://...), so
# machine-4 itself needs no compose plugin. Host networking for both: the agent's iperf3 must leave on the
# VLAN 5 address, and its API listens on the lab address only (never on a TSN VLAN: it must stay reachable
# while the injected load saturates the TSN link).
name: tsn-traffic-node

services:
  metrics-manager:
    image: docker.io/intel/metrics-manager:2026.2.0
    privileged: true
    pid: host
    volumes:
      - /sys:/sys:ro
    ports:
      - "${METRICS_PORT:-19090}:9090"
    # The image only checks /health, which still passes when the collector (telegraf) has stopped delivering
    # (the stream then carries no metrics). This wrapper restarts the service after 3 empty checks (~1 min);
    # `restart: unless-stopped` brings it back.
    command:
      - sh
      - -c
      - |
        /entrypoint.sh &
        pid=$$!
        trap 'kill $$pid; wait $$pid; exit 0' TERM INT
        sleep 60
        bad=0
        while kill -0 $$pid 2>/dev/null; do
          if python -c "
        import urllib.request, sys
        r = urllib.request.urlopen('http://localhost:9090/metrics/stream', timeout=8)
        for l in r:
            if l.startswith(b'data:'):
                sys.exit(0 if b'\"metrics\": [{' in l else 1)
        sys.exit(1)"; then bad=0; else bad=$$((bad+1)); fi
          if [ $$bad -ge 3 ]; then echo "metrics stream has no data, restarting"; kill $$pid; bad=0; fi
          sleep 20
        done
        wait $$pid
    restart: unless-stopped

  load-agent:
    image: tsn-load-agent:local  # built on machine-1 and copied over by deploy.sh
    network_mode: host
    environment:
      LOAD_BIND: ${LOAD_BIND:?set LOAD_BIND (machine-4 lab address)}
      LOAD_PORT: ${LOAD_PORT:-8099}
      SERVER_IP: ${SERVER_IP:?set SERVER_IP (machine-1 VLAN 5 address)}
      CLIENT_IP: ${CLIENT_IP:?set CLIENT_IP (machine-4 VLAN 5 address)}
      MAX_MBPS: ${MAX_MBPS:-1000}
    restart: unless-stopped
