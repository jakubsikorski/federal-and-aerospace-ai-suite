#
# Nginx reverse proxy / TLS termination for the Standalone (pymavlink) stack.
# Uses self-signed cert, HTTP->HTTPS redirect, hardened TLS.
#
# This service publishes the web, RTSP and MQTT ports to the host. The only other
# published port is mavlink-router's UDP 14551 for remote ground-control stations
# (see docker-compose-pymavlink.yml). All backend services
# (dlstreamer-pipeline-server, metrics-manager) are reachable only on the
# internal `app_network` Docker network.
#
#   https://<HOST_IP>/                         -> DL Streamer Pipeline Server REST API (8081)
#   https://<HOST_IP>/metrics/stream           -> metrics-manager SSE stream (9090)
#   https://<HOST_IP>/api/v1/metrics/latest    -> metrics-manager REST snapshot (9090)
#   rtsp://<HOST_IP>:8555/...                  -> DL Streamer annotated RTSP stream
#   mqtt://<HOST_IP>:1883                      -> mosquitto broker (scene captions, CAPTION=true)

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream dlstreamer {
        server dlstreamer-pipeline-server:8081;
    }

    upstream metrics_manager {
        server metrics-manager:9090;
    }

    # HTTP server - redirect to HTTPS
    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name localhost;

        # Pipeline start/stop requests are small JSON payloads; 50M is
        # generous headroom — no file-upload endpoint exists here.
        client_max_body_size 50M;

        # SSL configuration
        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # SSL security settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-XSS-Protection "1; mode=block";

        # metrics-manager — SSE stream
        location /metrics/ {
            proxy_pass         http://metrics_manager/metrics/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # Required for the metrics SSE stream
            proxy_buffering      off;
            proxy_cache          off;
            proxy_read_timeout   3600s;
        }

        # metrics-manager — REST snapshot
        location /api/v1/metrics/ {
            proxy_pass         http://metrics_manager/api/v1/metrics/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # DL Streamer Pipeline Server — REST API (pipeline control and status)
        location / {
            proxy_pass         http://dlstreamer/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }
    }
}

# RTSP and MQTT are not HTTP protocols and cannot be terminated by the http {}
# block above — the stream {} module gives them raw TCP passthrough on the
# same nginx container so the backend containers themselves stay unexposed.
stream {
    server {
        listen 8555;
        proxy_pass dlstreamer-pipeline-server:8555;
    }

    # mosquitto broker — only needed to observe/test scene captions
    # (CAPTION=true) from outside the Docker network, e.g. via mosquitto_sub
    # from the host. MQTT has no TLS here (matches the broker's own config);
    # treat this port as trusted-network-only, same as the RTSP passthrough.
    server {
        listen 1883;
        proxy_pass broker:1883;
    }
}
