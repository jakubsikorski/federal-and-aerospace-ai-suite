[General]
TcpServerPort=0

[UdpEndpoint px4]
Mode=Server
Address=0.0.0.0
Port=14550

[UdpEndpoint broadcast]
Mode=Normal
Address=255.255.255.255
Port=14541

# Ground-control stations on other machines (QGroundControl: Comm Links -> Add ->
# UDP, Server Addresses = <HOST_IP>:14551). The station sends first and the router
# learns its address, then forwards everything between it and PX4. Published by
# docker-compose-pymavlink.yml on HOST_IP only.
[UdpEndpoint qgc]
Mode=Server
Address=0.0.0.0
Port=14551
