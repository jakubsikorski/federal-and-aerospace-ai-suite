services:

  broker:
    image: docker.io/library/eclipse-mosquitto:2.0.22
    container_name: uav-va-broker
    environment:
      - http_proxy=${http_proxy}
      - https_proxy=${https_proxy}
      - no_proxy=${no_proxy},${HOST_IP}
      - NO_PROXY=${no_proxy},${HOST_IP}
    volumes:
      - ./configs/mosquitto:/mosquitto/config
    networks:
      - app_network
    restart: unless-stopped

  px4:
    image: px4io/px4-sitl:latest
    hostname: px4-sitl
    container_name: uav-va-px4
    volumes:
      - ./10040_sihsim_quadx.post:/opt/px4/etc/init.d-posix/airframes/10040_sihsim_quadx.post
    stdin_open: true
    tty: true
    networks:
      - app_network
    depends_on:
       - mavlink-router
    # PX4 looks the router's address up only when it starts (see 10040_sihsim_quadx.post), so if
    # mavlink-router is ever recreated with a new address, restart this container as well.
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mavlink-router:
    build:
      context: ../uav-mission-compute-sdk/infra/px4-sim/mavlink-router
      dockerfile: Dockerfile
      args:
        http_proxy:  ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy:    ${no_proxy:-localhost,127.0.0.0/8}
        NO_PROXY:    ${NO_PROXY:-localhost,127.0.0.0/8}
    image: uav-vision-analytics-mavlink-router:local
    container_name: uav-va-mavlink-router
    restart: unless-stopped
    volumes:
      - ./configs/mavlink-router/main.conf:/etc/mavlink-router/main.conf
    # MAVLink over UDP for a remote QGroundControl; bound to HOST_IP like the
    # other published ports (127.0.0.1 only when HOST_IP is unset).
    ports:
      - "${HOST_IP:-127.0.0.1}:${MAVLINK_UDP_PORT:-14551}:14551/udp"
    networks:
      - app_network

  dlstreamer-pipeline-server:
    build:
      context: .
      dockerfile_inline: |
        FROM ${DLSTREAMER_PIPELINE_SERVER_IMAGE}
        RUN pip install --no-cache-dir pymavlink
    image: ${DLSTREAMER_PIPELINE_SERVER_IMAGE}-pymavlink
    container_name: uav-va-dlstreamer-pipeline-server
    environment:
      - http_proxy=${http_proxy}
      - https_proxy=${https_proxy}
      - no_proxy=${no_proxy},${HOST_IP},host.docker.internal
      - NO_PROXY=${no_proxy},${HOST_IP},host.docker.internal
      - ENABLE_RTSP=true
      - RTSP_PORT=8555
      - APPEND_PIPELINE_NAME_TO_PUBLISHER_TOPIC=true
      - RUN_MODE=EVA
      - EMIT_SOURCE_AND_DESTINATION=true
      - REST_SERVER_PORT=8081
      - SERVICE_NAME=dlstreamer-pipeline-server
      - MQTT_HOST=broker
      - MQTT_PORT=1883
      - ENABLE_OPEN_TELEMETRY=true
      # NPU related environment variables
      - ZE_ENABLE_ALT_DRIVERS=libze_intel_npu.so
      - NPU_DEVICE=${NPU_DEVICE:-/dev/null}
    volumes:
      - dlstreamer-pipeline-server-pipeline-root:/var/cache/pipeline_root:uid=1999,gid=1999
      - "./resources:/home/pipeline-server/resources"
      - "./configs/config-pymavlink.json:/home/pipeline-server/config.json"
      - "./gvapython/telemetry-overlay-pymavlink.py:/home/pipeline-server/gvapython/telemetry-overlay-pymavlink.py"
      - "./scripts/mavlink_pipeline_manager.py:/home/pipeline-server/scripts/pipeline_manager.py"
      - "./scripts/camera_config.py:/home/pipeline-server/scripts/camera_config.py:ro"
      # The folder with cameras-pymavlink.yaml is mounted, not the file: editors save by replacing the file, and a
      # single-file mount would keep showing the old one inside the container.
      - "./configs:/home/pipeline-server/configs:rw"
      - "/run/udev:/run/udev:ro"
      - "/tmp:/tmp"
    group_add:
      # Group IDs of the GPU/NPU/camera device nodes, written to .env by scripts/update_device_gids.sh
      - "${GPU_CARD_GID:-44}"
      - "${GPU_RENDER_GID:-109}"
      - "${NPU_GID:-65501}"
      - "${CAMERA_GID:-65502}"
    device_cgroup_rules:
      - "c 189:* rmw"
      - "c 209:* rmw"
      - "a 189:* rwm"
    devices:
      - ${GPU_DEVICE:-/dev/dri/card0}:${GPU_DEVICE:-/dev/dri/card0}
      - ${GPU_RENDER_DEVICE:-/dev/dri/renderD128}:${GPU_RENDER_DEVICE:-/dev/dri/renderD128}
      - ${NPU_DEVICE:-/dev/null}:${NPU_DEVICE:-/dev/null}
      # live cameras (RealSense, USB webcams): each one set in .env appears under the same path in the
      # container, so the path in configs/cameras-pymavlink.yaml is the host path
      - ${CAMERA_DEVICE_1:-/dev/null}:${CAMERA_DEVICE_1:-/dev/null}
      - ${CAMERA_DEVICE_2:-/dev/null}:${CAMERA_DEVICE_2:-/dev/null}
      - ${CAMERA_DEVICE_3:-/dev/null}:${CAMERA_DEVICE_3:-/dev/null}
      - ${CAMERA_DEVICE_4:-/dev/null}:${CAMERA_DEVICE_4:-/dev/null}
    networks:
      - app_network
    # Not "on-failure": when the pipeline server aborts (for example a GPU runtime error while
    # loading several models) its startup script still exits with code 0, which "on-failure"
    # would not restart. A manual `docker stop` still stays stopped.
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  metrics-manager:
    image: intel/metrics-manager:2026.2.0
    container_name: uav-va-metrics-manager
    privileged: true
    pid: host
    devices:
      - /dev/dri            # Intel GPU — card0 + renderD128 required for qmassa
    volumes:
      - /sys:/sys:ro
    restart: unless-stopped
    networks:
      - app_network

  # Nginx reverse proxy / TLS — publishes the HTTP(S), RTSP and MQTT ports to
  # the host (mavlink-router publishes its own UDP port above). Binds to HOST_IP (falls back to loopback-only when
  # HOST_IP is unset) rather than all interfaces.
  nginx:
    image: nginx:1.27-alpine
    container_name: uav-va-nginx
    restart: unless-stopped
    volumes:
      - ./configs/nginx/nginx-pymavlink.conf:/etc/nginx/nginx.conf:ro
      - ./configs/nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "${HOST_IP:-127.0.0.1}:80:80"
      - "${HOST_IP:-127.0.0.1}:443:443"
      - "${HOST_IP:-127.0.0.1}:8555:8555"
      - "${HOST_IP:-127.0.0.1}:1883:1883"
    networks:
      - app_network
    depends_on:
      - dlstreamer-pipeline-server
      - metrics-manager
      - broker

networks:
  app_network:
    driver: "bridge"

volumes:
  dlstreamer-pipeline-server-pipeline-root:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
