services:

  dlstreamer-pipeline-server:
    image: ${DLSTREAMER_PIPELINE_SERVER_IMAGE}
    container_name: uav-va-dlstreamer-pipeline-server
    environment:
      - http_proxy=${http_proxy}
      - https_proxy=${https_proxy}
      - no_proxy=${no_proxy},${HOST_IP},host.docker.internal
      - NO_PROXY=${no_proxy},${HOST_IP},host.docker.internal
      - ENABLE_WEBRTC=true
      - ENABLE_RTSP=true
      - RTSP_PORT=8555
      - WEBRTC_SIGNALING_SERVER=http://${HOST_IP}:8889
      - APPEND_PIPELINE_NAME_TO_PUBLISHER_TOPIC=true
      - RUN_MODE=EVA
      - EMIT_SOURCE_AND_DESTINATION=true
      - REST_SERVER_PORT=8081
      - SERVICE_NAME=dlstreamer-pipeline-server
      # The caption publisher of the pipelines uses MQTT_HOST/MQTT_PORT. This stack has no broker of its own: it is the
      # SDK's (container mqtt-broker, published on host port 1883), reached through host.docker.internal.
      - MQTT_HOST=host.docker.internal
      - MQTT_PORT=${MQTT_BROKER_PORT:-1883}
      - ENABLE_OPEN_TELEMETRY=false
      # NPU related environment variables
      - ZE_ENABLE_ALT_DRIVERS=libze_intel_npu.so
      # UAV Mission Compute SDK related environment variables
      - UAV_ID=${UAV_ID:-uav-1}
      # the camera manager is the one of the pymavlink stack; here the SDK's MQTT status topic arms it and
      # the cameras are RTSP streams (configs/cameras-uavsdk.yaml)
      - ARM_SOURCE=mqtt
      - CAMERAS_CONFIG=/home/pipeline-server/configs/cameras-uavsdk.yaml
      - NPU_DEVICE=${NPU_DEVICE:-/dev/null}
    volumes:
      - dlstreamer-pipeline-server-pipeline-root:/var/cache/pipeline_root:uid=1999,gid=1999
      - "./resources:/home/pipeline-server/resources"
      - "./configs/config-uavsdk.json:/home/pipeline-server/config.json"
      - "./gvapython/telemetry-overlay-uavsdk.py:/home/pipeline-server/gvapython/telemetry-overlay-uavsdk.py"
      - "./scripts/mavlink_pipeline_manager.py:/home/pipeline-server/scripts/pipeline_manager.py"
      - "./scripts/camera_config.py:/home/pipeline-server/scripts/camera_config.py:ro"
      # the folder, not the file: editors replace files and a file mount would keep showing the old one
      - "./configs:/home/pipeline-server/configs:rw"
      - "/run/udev:/run/udev:ro"
      - "/tmp:/tmp"
    group_add:
      # Group IDs of the GPU/NPU/camera device nodes, written to .env by scripts/update_device_gids.sh
      - "${GPU_CARD_GID:-44}"
      - "${GPU_RENDER_GID:-109}"
      - "${NPU_GID:-65501}"
      - "${CAMERA_GID:-65502}"
    device_cgroup_rules:
      - "c 189:* rmw"
      - "c 209:* rmw"
      - "a 189:* rwm"
    devices:
      - ${GPU_DEVICE:-/dev/dri/card0}:${GPU_DEVICE:-/dev/dri/card0}
      - ${GPU_RENDER_DEVICE:-/dev/dri/renderD128}:${GPU_RENDER_DEVICE:-/dev/dri/renderD128}
      - ${NPU_DEVICE:-/dev/null}:${NPU_DEVICE:-/dev/null}
    networks:
      - app_network
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 5
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Host metrics (CPU, GPU, NPU, memory) for the ground-station dashboard; reached through nginx
  # (/metrics/stream and /api/v1/metrics/latest). The service name is what nginx uses; the container is
  # prefixed uav-va- so it never clashes with the SDK's own metrics-manager container.
  metrics-manager:
    image: intel/metrics-manager:2026.3.0-rc1
    container_name: uav-va-metrics-manager
    privileged: true
    pid: host
    devices:
      - /dev/dri            # Intel GPU — card0 + renderD128 required for qmassa
    volumes:
      - /sys:/sys:ro
    restart: unless-stopped
    networks:
      - app_network

  # Nginx reverse proxy / TLS — the only service that publishes
  # ports to the host. Binds to HOST_IP (falls back to loopback-only when
  # HOST_IP is unset) rather than all interfaces.
  nginx:
    image: nginx:1.27-alpine
    container_name: uav-va-nginx
    restart: unless-stopped
    volumes:
      - ./configs/nginx/nginx-uavsdk.conf:/etc/nginx/nginx.conf:ro
      - ./configs/nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "${HOST_IP:-127.0.0.1}:80:80"
      - "${HOST_IP:-127.0.0.1}:443:443"
      - "${HOST_IP:-127.0.0.1}:8555:8555"
    networks:
      - app_network
    depends_on:
      - dlstreamer-pipeline-server
      - metrics-manager

networks:
  app_network:
    driver: "bridge"

volumes:
  dlstreamer-pipeline-server-pipeline-root:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
