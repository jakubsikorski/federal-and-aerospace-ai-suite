#
# mediamtx sidecar for "H.264 Relay" video mode (see docker-compose-
# mediamtx.yml / backend/main.py's /api/relay-path). Pulls an already-H.264
# RTSP source from the remote UAV host on demand and re-serves it to the
# browser as WebRTC (WHEP) -- pure remux, no transcoding.
#
# The default auth policy only allows the "api" action from 127.0.0.1/::1,
# but viz-backend calls the control API from a different container on the
# compose network -- so it's opened up to "any" here.

authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: api
      - action: read
      - action: playback

api: yes
apiAddress: :9997

readTimeout: 60s
writeTimeout: 60s

pathDefaults:
  sourceOnDemandStartTimeout: 60s
  # How long to keep the source running after the last reader disconnects
  # before tearing it down again -- 10s default means a viewer briefly
  # reloading the page (or two cards polling in quick succession) can
  # retrigger a full "start on demand" cycle on the UAV's RTSP encoder
  # unnecessarily.
  sourceOnDemandCloseAfter: 60s

rtsp: no
rtmp: no
hls: no
srt: no

webrtc: yes
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
# ICE-TCP candidate on the same port number as UDP: a fallback for browser networks
# that block or badly drop UDP (the browser still prefers UDP when it works).
webrtcLocalTCPAddress: :8189

# Paths are added/updated at runtime via the control API (viz-backend's
# /api/relay-path), one per device ("relay-cpu"/"relay-gpu"/"relay-npu"),
# each pointing its "source" at the current rtsp://<remote-host>:8555/...
# -- so nothing needs declaring here statically.
paths:
