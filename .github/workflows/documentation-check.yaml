name: Documentation Check

on: # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main
      - release-*
  workflow_dispatch:

permissions: {}

jobs:
  filter:
    permissions:
      contents: read # needed for actions/checkout
    runs-on: ubuntu-latest
    outputs:
      deterministic-threat-detection_changed: ${{ steps.filter.outputs.deterministic-threat-detection }}
      handheld-multi-modal_changed: ${{ steps.filter.outputs.handheld-multi-modal }}
      uav-mission-compute-sdk_changed: ${{ steps.filter.outputs.uav-mission-compute-sdk }}
      uav-vision-analytics_changed: ${{ steps.filter.outputs.uav-vision-analytics }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set paths filter
        id: filter
        uses: dorny/paths-filter@4512585405083f25c027a35db413c2b3b9006d50
        with:
          filters: |
            deterministic-threat-detection:
              - 'deterministic-threat-detection/docs/user-guide/**'
            handheld-multi-modal:
              - 'handheld-multi-modal/docs/user-guide/**'
            uav-mission-compute-sdk:
              - 'uav-mission-compute-sdk/docs/user-guide/**'
            uav-vision-analytics:
              - 'uav-vision-analytics/docs/user-guide/**'

  build-deterministic-threat-detection:
    permissions:
      contents: read # needed for actions/checkout
    needs: filter
    if: ${{ needs.filter.outputs.deterministic-threat-detection_changed == 'true' }}
    uses: ./.github/workflows/docs-reusable-workflow.yaml
    with:
      docs_directory: deterministic-threat-detection

  build-handheld-multi-modal:
    permissions:
      contents: read # needed for actions/checkout
    needs: filter
    if: ${{ needs.filter.outputs.handheld-multi-modal_changed == 'true' }}
    uses: ./.github/workflows/docs-reusable-workflow.yaml
    with:
      docs_directory: handheld-multi-modal

  build-uav-mission-compute-sdk:
    permissions:
      contents: read # needed for actions/checkout
    needs: filter
    if: ${{ needs.filter.outputs.uav-mission-compute-sdk_changed == 'true' }}
    uses: ./.github/workflows/docs-reusable-workflow.yaml
    with:
      docs_directory: uav-mission-compute-sdk

  build-uav-vision-analytics:
    permissions:
      contents: read # needed for actions/checkout
    needs: filter
    if: ${{ needs.filter.outputs.uav-vision-analytics_changed == 'true' }}
    uses: ./.github/workflows/docs-reusable-workflow.yaml
    with:
      docs_directory: uav-vision-analytics
